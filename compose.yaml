services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aegis
      POSTGRES_DB: aegis
      POSTGRES_PASSWORD: ${AEGIS_DB_PASSWORD:?Set AEGIS_DB_PASSWORD in .env}
    volumes:
      - aegis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://aegis:${AEGIS_DB_PASSWORD}@db/aegis
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn aegis.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/api/v1/health',timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 20
  worker:
    build: ./backend
    command: ["python", "-m", "aegis.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg2://aegis:${AEGIS_DB_PASSWORD}@db/aegis
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
volumes:
  aegis-data:
